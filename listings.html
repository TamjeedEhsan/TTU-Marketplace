<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Listings — TTU Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="listings.css" />
  </head>
  <body>
    <header class="navbar">
      <a class="logo" href="listings.html">
        <span class="logo-ttu">TTU</span>
        <span class="logo-name">MARKETPLACE</span>
      </a>

      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input
          id="search-input"
          type="search"
          placeholder="Search for textbooks, furniture, electronics..."
        />
      </div>

      <div class="nav-actions">
        <button class="icon-btn" type="button" aria-label="Favorites">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 20s-7-4.4-9.2-8.2C1.2 9.2 2.2 6 5.2 5.3c1.8-.4 3.4.4 4.3 1.8C10.4 5.7 12 4.9 13.8 5.3c3 .7 4 3.9 2.4 6.5C19 15.6 12 20 12 20z"
            ></path>
          </svg>
        </button>
        <button class="icon-btn" type="button" aria-label="Messages">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4 6h16v10H7l-3 3V6z"
            ></path>
          </svg>
        </button>
        <a href="profile.html" aria-label="Your profile">
          <img class="avatar" src="assets/images/avatar.jpg" alt="" />
        </a>
        <a class="sell-btn" href="sell.html">
          <span class="sell-full">+ Sell an Item</span>
          <span class="sell-short">+ Sell</span>
        </a>
      </div>
    </header>

    <main class="page">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="listings.html">Home</a>
        <span class="crumb-sep">&gt;</span>
        <span>All Listings</span>
      </nav>

      <section class="page-header">
        <div>
          <h1>All Listings</h1>
          <p>Find great deals from fellow Red Raiders.</p>
        </div>
        <div class="page-controls">
          <label class="sort-label" for="sort-select">
            <select id="sort-select">
              <option value="newest">Newest First</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
            </select>
          </label>
          <div class="view-toggle" role="group" aria-label="View">
            <button
              id="grid-view-btn"
              class="view-btn is-active"
              type="button"
              aria-label="Grid view"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
              </svg>
            </button>
            <button
              id="list-view-btn"
              class="view-btn"
              type="button"
              aria-label="List view"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h16M4 12h16M4 17h16"></path>
              </svg>
            </button>
          </div>
        </div>
      </section>

      <button id="filters-toggle" class="filters-toggle" type="button">
        Filters
      </button>

      <div class="marketplace">
        <aside class="filters" id="filters">
          <div class="filter-section">
            <h2>Categories</h2>
            <div class="category-list">
              <button class="category-btn is-active" type="button" data-category="all">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="3" width="7" height="7"></rect>
                  <rect x="14" y="3" width="7" height="7"></rect>
                  <rect x="3" y="14" width="7" height="7"></rect>
                  <rect x="14" y="14" width="7" height="7"></rect>
                </svg>
                All Categories
              </button>
              <button class="category-btn" type="button" data-category="Textbooks">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 5h9a3 3 0 0 1 3 3v12H8a3 3 0 0 0-3 3V5z"></path>
                  <path d="M8 5v15"></path>
                </svg>
                Textbooks
              </button>
              <button class="category-btn" type="button" data-category="Furniture">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 13h16v4H4zM6 13V9a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4"></path>
                  <path d="M6 17v2M18 17v2"></path>
                </svg>
                Furniture
              </button>
              <button class="category-btn" type="button" data-category="Electronics">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="12" rx="2"></rect>
                  <path d="M8 21h8M12 17v4"></path>
                </svg>
                Electronics
              </button>
              <button class="category-btn" type="button" data-category="Clothing">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 6l4-3 4 3 4-1 2 5-4 1v9H6V11L2 10l2-5 4 1z"></path>
                </svg>
                Clothing
              </button>
              <button class="category-btn" type="button" data-category="Bikes">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="6" cy="16" r="3.5"></circle>
                  <circle cx="18" cy="16" r="3.5"></circle>
                  <path d="M6 16l4-8h5l3 8M10 8l2 8"></path>
                </svg>
                Bikes
              </button>
              <button class="category-btn" type="button" data-category="Other">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="4" y="7" width="16" height="13" rx="1"></rect>
                  <path d="M9 7V5h6v2"></path>
                </svg>
                Other
              </button>
            </div>
          </div>

          <div class="filter-section">
            <h2>Price Range</h2>
            <div class="price-row">
              <input id="min-price" type="number" min="0" placeholder="Min" />
              <input id="max-price" type="number" min="0" placeholder="Max" />
            </div>
            <button id="apply-price" class="apply-btn" type="button">Apply</button>
          </div>

          <div class="filter-section">
            <h2>Location</h2>
            <label class="location-field">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"></path>
                <circle cx="12" cy="10" r="2.2"></circle>
              </svg>
              <select id="location-select">
                <option value="all">Lubbock, TX</option>
                <option value="TTU">TTU</option>
                <option value="Lubbock, TX">Lubbock, TX only</option>
              </select>
              <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 9l6 6 6-6"></path>
              </svg>
            </label>
          </div>

          <div class="filter-section last">
            <h2>Condition</h2>
            <label class="check-row">
              <input type="checkbox" name="condition" value="New" />
              New
            </label>
            <label class="check-row">
              <input type="checkbox" name="condition" value="Like New" />
              Like New
            </label>
            <label class="check-row">
              <input type="checkbox" name="condition" value="Good" />
              Good
            </label>
            <label class="check-row">
              <input type="checkbox" name="condition" value="Fair" />
              Fair
            </label>
            <label class="check-row">
              <input type="checkbox" name="condition" value="For Parts" />
              For Parts
            </label>
          </div>
        </aside>

        <section class="listings">
          <p class="listing-count" id="listing-count">24 listings</p>
          <div class="product-grid" id="product-grid"></div>
          <p class="empty-state" id="empty-state" hidden>No listings match your filters.</p>
        </section>
      </div>
    </main>

    <script src="utils.js"></script>
    <script src="products.js"></script>
    <script src="listings.js"></script>
  </body>
</html>
